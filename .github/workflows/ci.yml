name: FlowStock CI

on:
    push:
        branches: 
            - main
            - develop
           
    pull_request: 
        branches: 
            - main
            - develop

jobs:
    build-and-test:
        runs-on: 
            ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              
            - name: Setup .Net
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'

            - name: Restore
              run: dotnet restore FlowStock.sln
              
            - name: Build
              run: dotnet build FlowStock.sln --no-restore --configuration Release
              
            - name: Test
              run: dotnet test FlowStock.sln --no-build --configuration Release  