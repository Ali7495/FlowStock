services:
  postgres:
    image: postgres:latest
    container_name: flow-postgres
    
    environment:
      POSTGRES_USER: flowstock
      POSTGRES_PASSWORD: flowstock
      POSTGRES_DB: UsermanagementDb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flow-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ali@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123456

    ports:
      - "5050:80"

    depends_on:
      - postgres    

  redis:
    image: redis:latest
    container_name: flow-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data  

volumes:
  postgres-data:
  redis-data: